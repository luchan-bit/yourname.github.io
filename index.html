<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>身心靈復康導航 - 每日一小步</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f0f4f0; /* 護眼森林綠背景 */
            -webkit-tap-highlight-color: transparent;
        }
        .tab-active {
            border-bottom: 4px solid #059669;
            color: #059669;
        }
        .progress-circle {
            transition: stroke-dashoffset 0.5s ease;
        }
    </style>
</head>
<body class="pb-24">

    <!-- 頂部標題與免責聲明 -->
    <header class="bg-white px-6 py-6 shadow-sm text-center">
        <h1 class="text-xl font-bold text-emerald-800">身心靈復康導航 🌿</h1>
        <p class="text-xs text-gray-400 mt-1 italic">註：本計劃為輔助參考，開始前請務必諮詢主診醫生意見。</p>
    </header>

    <!-- 進度圓環 -->
    <div class="flex justify-center my-6">
        <div class="relative flex items-center justify-center">
            <svg class="w-32 h-32">
                <circle cx="64" cy="64" r="58" stroke="#e5e7eb" stroke-width="8" fill="transparent" />
                <circle id="progressBar" cx="64" cy="64" r="58" stroke="#10b981" stroke-width="8" fill="transparent" 
                    stroke-dasharray="364.4" stroke-dashoffset="364.4" transform="rotate(-90 64 64)" class="progress-circle" />
            </svg>
            <div class="absolute text-center">
                <span id="progressText" class="text-2xl font-bold text-emerald-700">0%</span>
                <p class="text-[10px] text-gray-500">今日完成度</p>
            </div>
        </div>
    </div>

    <main class="max-w-md mx-auto px-4">
        
        <!-- 復康任務列表 -->
        <div id="rehabList" class="space-y-4">
            <!-- 任務會由 JS 渲染 -->
        </div>

        <!-- 呼吸練習計時器 (肺癌康復重點) -->
        <div class="mt-8 bg-emerald-800 rounded-3xl p-6 text-white shadow-lg">
            <h3 class="text-lg font-bold mb-2 flex items-center">
                <span class="mr-2">🫁</span> 縮唇呼吸練習 (Pursed-lip Breathing)
            </h3>
            <p class="text-xs text-emerald-200 mb-4">用鼻吸氣 2 秒，縮起嘴唇像吹蠟燭般慢慢呼氣 4 秒。</p>
            <div class="flex items-center justify-between">
                <div class="text-3xl font-mono font-bold" id="timerDisplay">05:00</div>
                <button id="timerBtn" onclick="toggleTimer()" class="bg-white text-emerald-800 px-6 py-2 rounded-full font-bold active:scale-95 transition-all">
                    開始練習
                </button>
            </div>
        </div>

        <!-- 每日靈修/情緒金句 -->
        <div class="mt-8 bg-white p-6 rounded-3xl shadow-sm border-l-4 border-emerald-500">
            <p id="quoteDisplay" class="text-gray-700 leading-relaxed italic">「應當一無掛慮，只要凡事藉著禱告、祈求，和感謝，將你們所要的告訴神。」</p>
            <p class="text-xs text-gray-400 mt-2 text-right">— 腓立比書 4:6</p>
        </div>

    </main>

    <!-- 底部清空紀錄 -->
    <footer class="mt-10 text-center px-4">
        <button onclick="resetDaily()" class="text-gray-400 text-sm underline">新的一天：重設進度</button>
    </footer>

    <script>
        const tasksData = [
            { id: 1, title: '洗肺操 (呼吸訓練)', sub: '早午晚各 5-10 分鐘', category: '身', icon: '🌬️' },
            { id: 2, title: '平路散步', sub: '每日 15-20 分鐘，不宜過勞', category: '身', icon: '🚶' },
            { id: 3, title: '高營養飲食', sub: '補充足夠蛋白質 (肉/蛋/奶)', category: '食', icon: '🥚' },
            { id: 4, title: '情緒/靈修時間', sub: '寫日記、禱告或靜坐 10 分鐘', category: '心', icon: '🙏' },
            { id: 5, title: '充足睡眠', sub: '晚上 11 點前休息', category: '息', icon: '🌙' }
        ];

        let completedTasks = JSON.parse(localStorage.getItem('rehab_completed')) || [];
        let timerSeconds = 300;
        let timerInterval = null;

        window.onload = () => {
            renderTasks();
            updateProgress();
        };

        function renderTasks() {
            const list = document.getElementById('rehabList');
            list.innerHTML = '';

            tasksData.forEach(task => {
                const isDone = completedTasks.includes(task.id);
                const item = document.createElement('div');
                item.className = `bg-white p-5 rounded-3xl shadow-sm flex items-center justify-between transition-all ${isDone ? 'opacity-60 grayscale' : ''}`;
                item.innerHTML = `
                    <div class="flex items-center space-x-4">
                        <div class="w-12 h-12 bg-emerald-50 rounded-2xl flex items-center justify-center text-2xl">
                            ${task.icon}
                        </div>
                        <div>
                            <h4 class="font-bold text-gray-800">${task.title}</h4>
                            <p class="text-xs text-gray-400">${task.sub}</p>
                        </div>
                    </div>
                    <button onclick="toggleTask(${task.id})" class="w-10 h-10 rounded-full border-2 ${isDone ? 'bg-emerald-500 border-emerald-500' : 'border-gray-200'} flex items-center justify-center">
                        ${isDone ? '✅' : ''}
                    </button>
                `;
                list.appendChild(item);
            });
        }

        function toggleTask(id) {
            if (completedTasks.includes(id)) {
                completedTasks = completedTasks.filter(tid => tid !== id);
            } else {
                completedTasks.push(id);
                // 震動反饋 (手機端)
                if (navigator.vibrate) navigator.vibrate(50);
            }
            localStorage.setItem('rehab_completed', JSON.stringify(completedTasks));
            renderTasks();
            updateProgress();
        }

        function updateProgress() {
            const percent = Math.round((completedTasks.length / tasksData.length) * 100);
            document.getElementById('progressText').innerText = percent + '%';
            
            const circle = document.getElementById('progressBar');
            const circumference = 58 * 2 * Math.PI;
            const offset = circumference - (percent / 100 * circumference);
            circle.style.strokeDashoffset = offset;
        }

        function toggleTimer() {
            const btn = document.getElementById('timerBtn');
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
                btn.innerText = '繼續練習';
                btn.className = "bg-white text-emerald-800 px-6 py-2 rounded-full font-bold active:scale-95";
            } else {
                btn.innerText = '暫停';
                btn.className = "bg-emerald-600 text-white px-6 py-2 rounded-full font-bold active:scale-95";
                timerInterval = setInterval(() => {
                    if (timerSeconds > 0) {
                        timerSeconds--;
                        updateTimerDisplay();
                    } else {
                        clearInterval(timerInterval);
                        alert('練習完成！呼吸順暢晒！');
                        resetTimer();
                    }
                }, 1000);
            }
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timerSeconds / 60);
            const secs = timerSeconds % 60;
            document.getElementById('timerDisplay').innerText = 
                `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function resetTimer() {
            timerSeconds = 300;
            updateTimerDisplay();
            document.getElementById('timerBtn').innerText = '開始練習';
        }

        function resetDaily() {
            if(confirm('係咪新的一天？將會重設進度紀錄。')) {
                completedTasks = [];
                localStorage.setItem('rehab_completed', JSON.stringify(completedTasks));
                renderTasks();
                updateProgress();
            }
        }
    </script>
</body>
</html>
